<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07281D">
<meta name="description" content="Новогодний помощник по подаркам: четыре вопроса — и две-три идеи, которые подойдут именно этому человеку.">
<title>Помощник по подаркам — подберите идеальный новогодний подарок</title>
<style>
:root{
  --cream:#FBF4E4;
  --cream-soft:#FFFCF4;
  --ink:#0F3528;
  --ink-soft:#4E6557;
  --ink-muted:#7C8B7E;
  --emerald:#0E4B36;
  --emerald-deep:#07281D;
  --gold:#C8A15A;
  --gold-soft:#E7CF9B;
  --gold-deep:#9C7735;
  --line:rgba(200,161,90,.34);
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
  --sans:"Segoe UI",Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}

html{-webkit-text-size-adjust:100%;background:#06231A}

body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  font-family:var(--sans);
  color:var(--ink);
  background:#06231A;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(20px,4.5vw,58px) clamp(14px,3vw,30px);
  overflow-x:hidden;
}

/* ---------- фон ---------- */
.bg{
  position:fixed;
  inset:0;
  z-index:0;
  background-image:url("gift-cover.jpg");
  background-position:center center;
  background-size:cover;
  background-repeat:no-repeat;
  filter:saturate(.92) brightness(.94);
  transform:scale(1.03);
}

.veil{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 16%, rgba(8,36,27,.10) 0%, rgba(7,31,23,.52) 46%, rgba(3,16,12,.9) 100%),
    linear-gradient(180deg, rgba(6,28,21,.62) 0%, rgba(6,32,24,.44) 45%, rgba(3,17,12,.86) 100%),
    radial-gradient(42% 36% at 16% 8%, rgba(200,161,90,.20), transparent 72%);
}

#snow{
  position:fixed;
  inset:0;
  z-index:2;
  width:100%;
  height:100%;
  pointer-events:none;
  opacity:.85;
}

/* ---------- сцена ---------- */
.stage{
  position:relative;
  z-index:3;
  width:100%;
  max-width:820px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ---------- карточка ---------- */
.card{
  position:relative;
  width:100%;
  padding:clamp(30px,5vw,54px) clamp(22px,5vw,54px) clamp(28px,4.4vw,46px);
  border-radius:26px;
  background:
    radial-gradient(120% 100% at 50% -10%, #FFFDF6 0%, #FBF3E2 44%, #F2E2C6 100%);
  border:1px solid rgba(214,183,124,.72);
  box-shadow:
    0 44px 100px -28px rgba(0,0,0,.78),
    0 0 0 1px rgba(255,255,255,.22) inset,
    0 1px 0 rgba(255,255,255,.65) inset;
  animation:cardIn .85s cubic-bezier(.2,.72,.2,1) both;
}

.card::before{
  content:"";
  position:absolute;
  inset:11px;
  border-radius:18px;
  border:1px solid rgba(200,161,90,.36);
  pointer-events:none;
}

.card::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:radial-gradient(75% 45% at 50% 0%, rgba(255,255,255,.5), transparent 70%);
}

.view{position:relative;z-index:1}

/* ---------- типографика ---------- */
.title,
.qtitle,
.idea__title{
  font-family:var(--serif);
  font-weight:600;
  color:var(--ink);
  text-wrap:balance;
}

.title{
  font-size:clamp(30px,4.6vw,49px);
  line-height:1.06;
  letter-spacing:-.015em;
  margin:16px 0 0;
}

.eyebrow{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin:0;
  font-size:10px;
  font-weight:700;
  letter-spacing:.26em;
  text-transform:uppercase;
  color:#8C6A2E;
}

.eyebrow__line{
  display:block;
  width:34px;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(156,119,53,.7));
}

.eyebrow__line:last-child{transform:scaleX(-1)}

.lede{
  margin:18px auto 0;
  max-width:46ch;
  font-size:16px;
  line-height:1.68;
  color:var(--ink-soft);
}

/* ---------- декор ---------- */
.sprig{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-bottom:18px;
}

.sprig__flake{
  font-size:19px;
  line-height:1;
  color:var(--gold-deep);
  text-shadow:0 1px 0 rgba(255,255,255,.6);
}

.sprig__line{
  width:52px;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(156,119,53,.55), transparent);
}

/* ---------- интро ---------- */
.intro{text-align:center;animation:rise .5s ease both}

.intro .btn{margin-top:30px}

.meta{
  margin:22px 0 0;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#8A7A5F;
}

/* ---------- кнопки ---------- */
.btn{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:16px 32px;
  border-radius:999px;
  border:1px solid transparent;
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  letter-spacing:.02em;
  line-height:1.2;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform .2s ease, box-shadow .25s ease, background .25s ease, border-color .2s ease;
}

.btn--primary{
  color:#FFF7E6;
  background:linear-gradient(180deg,#146048 0%,#0B3F2E 100%);
  border-color:rgba(231,207,155,.7);
  box-shadow:0 16px 32px -14px rgba(7,40,29,.8), 0 1px 0 rgba(255,255,255,.18) inset;
}

.btn--primary::after{
  content:"";
  position:absolute;
  inset:1px;
  border-radius:inherit;
  background:linear-gradient(180deg, rgba(255,255,255,.14), transparent 45%);
  pointer-events:none;
}

.btn--primary:hover{
  transform:translateY(-2px);
  background:linear-gradient(180deg,#1B7557 0%,#0D4A36 100%);
  box-shadow:0 22px 42px -16px rgba(7,40,29,.85), 0 1px 0 rgba(255,255,255,.22) inset;
}

.btn--primary:active{transform:translateY(0) scale(.995)}

.btn--ghost{
  color:var(--emerald);
  background:rgba(255,252,244,.6);
  border-color:rgba(200,161,90,.55);
  box-shadow:0 10px 24px -18px rgba(7,40,29,.7);
}

.btn--ghost:hover{
  background:var(--cream-soft);
  border-color:rgba(200,161,90,.9);
  transform:translateY(-2px);
}

.btn__arrow{transition:transform .25s ease}
.btn:hover .btn__arrow{transform:translateX(3px)}

.btn:focus-visible,
.opt:focus-visible,
.back:focus-visible{
  outline:2px solid var(--gold-deep);
  outline-offset:3px;
}

/* ---------- вопрос ---------- */
.question{animation:rise .45s ease both}

.progress{
  display:flex;
  gap:6px;
  margin-bottom:24px;
}

.progress span{
  flex:1;
  height:4px;
  border-radius:99px;
  background:rgba(14,75,54,.12);
  transition:background .45s ease;
}

.progress span.on{
  background:linear-gradient(90deg, #B08A45, #E3C78E);
}

.qhead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:20px;
}

.back{
  margin:0;
  padding:6px 2px;
  border:0;
  background:none;
  font-family:inherit;
  font-size:13px;
  letter-spacing:.02em;
  color:#5D7365;
  cursor:pointer;
  transition:color .2s ease;
}

.back:hover{color:var(--emerald)}

.step-label{
  font-size:10px;
  font-weight:700;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:#8C6A2E;
}

.qtitle{
  margin:0 0 10px;
  font-size:clamp(25px,3.5vw,35px);
  line-height:1.16;
  letter-spacing:-.01em;
}

.title:focus,\n.qtitle:focus{outline:none}

.qhint{
  margin:0 0 24px;
  max-width:52ch;
  font-size:14px;
  line-height:1.55;
  color:#5D7365;
}

/* ---------- варианты ---------- */
.options{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px;
}

.opt{
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  padding:14px 16px;
  border-radius:15px;
  border:1px solid rgba(200,161,90,.34);
  background:rgba(255,252,245,.66);
  color:var(--ink);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform .18s ease, box-shadow .22s ease, background .2s ease, border-color .2s ease;
}

@media (hover:hover){
  .opt:hover{
    background:var(--cream-soft);
    border-color:rgba(200,161,90,.82);
    box-shadow:0 16px 28px -22px rgba(11,62,45,.85);
    transform:translateY(-2px);
  }
}

.opt:active{transform:translateY(0) scale(.995)}

.opt__emoji{
  flex:none;
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:18px;
  line-height:1;
  background:radial-gradient(circle at 32% 26%, #FFFDF7, #F0E1C3);
  border:1px solid rgba(200,161,90,.4);
}

.opt__text{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
}

.opt__label{
  font-size:15px;
  font-weight:600;
  line-height:1.28;
}

.opt__desc{
  font-size:12px;
  line-height:1.4;
  color:#62776A;
}

/* ---------- результат ---------- */
.result{animation:rise .5s ease both}

.result .eyebrow{justify-content:flex-start;gap:10px}
.result .eyebrow__line:last-child{display:none}

.title--result{
  margin:10px 0 0;
  font-size:clamp(28px,4vw,40px);
  line-height:1.1;
}

.picked{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:17px 0 0;
}

.picked span{
  padding:5px 11px;
  border-radius:99px;
  border:1px solid rgba(200,161,90,.3);
  background:rgba(200,161,90,.14);
  font-size:11.5px;
  letter-spacing:.03em;
  color:#4C5F51;
}

.ideas{
  display:grid;
  gap:12px;
  margin:21px 0 16px;
}

.idea{
  display:flex;
  gap:15px;
  padding:17px 18px;
  border-radius:17px;
  border:1px solid rgba(200,161,90,.3);
  background:linear-gradient(180deg, rgba(255,253,247,.97), rgba(249,241,226,.92));
  box-shadow:0 18px 32px -28px rgba(7,40,29,.95);
  animation:rise .5s cubic-bezier(.2,.72,.2,1) both;
  animation-delay:var(--d,0ms);
}

.idea__icon{
  flex:none;
  display:grid;
  place-items:center;
  width:50px;
  height:50px;
  border-radius:14px;
  font-size:23px;
  line-height:1;
  background:radial-gradient(circle at 30% 22%, #FFFDF7, #EFE0C4);
  border:1px solid rgba(200,161,90,.38);
}

.idea__body{min-width:0}

.idea__title{
  margin:0 0 5px;
  font-size:19px;
  line-height:1.3;
  text-wrap:pretty;
}

.idea__desc{
  margin:0;
  font-size:13.5px;
  line-height:1.55;
  color:#5A7062;
}

.idea__meta{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:9px;
  font-size:12px;
  color:#8A7A5F;
}

.price{
  padding:3px 9px;
  border-radius:99px;
  background:rgba(200,161,90,.18);
  color:#0B3E2D;
  font-weight:700;
  letter-spacing:.02em;
}

.store{
  position:relative;
  padding-left:10px;
}

.store::before{
  content:"";
  position:absolute;
  left:0;
  top:50%;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#B9A17A;
  transform:translateY(-50%);
}

.tip{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:13px 16px;
  border-radius:0 13px 13px 0;
  border:1px solid rgba(200,161,90,.26);
  border-left:3px solid var(--gold);
  background:rgba(255,250,238,.62);
}

.tip__label{
  flex:none;
  padding-top:3px;
  font-size:9.5px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#8C6A2E;
}

.tip p{
  margin:0;
  font-size:13px;
  line-height:1.55;
  color:#4E6355;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:24px;
}

.actions .btn{flex:1 1 190px}

/* ---------- подпись ---------- */
.credits{
  margin:18px 0 0;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  text-align:center;
  color:rgba(248,241,227,.6);
  text-shadow:0 1px 14px rgba(0,0,0,.55);
}

.credits{padding-bottom:6px}

.credits b{color:rgba(248,241,227,.82);font-weight:600}

/* ---------- служебное ---------- */
.sr-only{
  position:absolute!important;
  width:1px;
  height:1px;
  margin:-1px;
  padding:0;
  overflow:hidden;
  clip:rect(0 0 0 0);
  white-space:nowrap;
  border:0;
}

.noscript{
  position:fixed;
  left:50%;
  bottom:24px;
  z-index:10;
  transform:translateX(-50%);
  padding:12px 20px;
  border-radius:12px;
  background:#FFF8E8;
  color:#0E4B36;
  font-family:var(--sans);
  font-size:14px;
}

/* ---------- анимации ---------- */
@keyframes cardIn{
  from{opacity:0;transform:translateY(24px) scale(.985)}
  to{opacity:1;transform:none}
}

@keyframes rise{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}

/* ---------- адаптив ---------- */
@media (max-width:640px){
  body{padding:16px 12px 24px;align-items:flex-start}
  .stage{margin:auto 0}
  .card{padding:28px 18px 26px;border-radius:22px}
  .card::before{inset:8px;border-radius:16px}
  .options{grid-template-columns:1fr}
  .opt{padding:12px 14px}
  .opt__emoji{width:36px;height:36px;font-size:17px}
  .opt__label{font-size:14px}
  .idea{padding:15px;gap:12px}
  .idea__icon{width:44px;height:44px;font-size:20px;border-radius:12px}
  .idea__title{font-size:17.5px}
  .title--result{font-size:27px}
  .actions{flex-direction:column}
  .actions .btn{width:100%;flex:1 1 auto}
  .credits{font-size:9px;letter-spacing:.05em}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-delay:0ms!important;
    transition-duration:.001ms!important;
  }
}

</style>
</head>

<div class="bg" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>
<canvas id="snow" aria-hidden="true"></canvas>

<main class="stage">
  <section class="card" id="card">
    <div class="view" id="view"></div>
  </section>
  <p class="credits">Идеи и цены — <b>gifts-data.txt</b> · <span id="data-note">1 320 идей · 264 подборки</span></p>
</main>

<div id="live" class="sr-only" aria-live="polite"></div>

<!--
  Копия gifts-data.txt встроена в страницу, чтобы всё работало при открытии
  index.html прямо с диска (file://). При запуске через http-сервер скрипт
  дополнительно перечитывает gifts-data.txt из папки проекта.
-->
<script type="text/plain" id="gifts-source">################################################################
#                                                              #
#        БАЗА ИДЕЙ ДЛЯ НОВОГОДНИХ ПОДАРКОВ — 2027              #
#        11 получателей · 264 подборки · 1320 идей             #
#                                                              #
################################################################

Файл собран как конструктор: вы выбираете получателя, бюджет, сферу
интересов и характер — и получаете готовые 2–3 идеи под эту комбинацию.
Ничего искать по всему тексту не нужно, достаточно открыть один блок.

КАК ПОЛЬЗОВАТЬСЯ
----------------
1. Найдите раздел получателя (список ниже, разделы 1–11).
2. Внутри раздела выберите бюджет: 1.1 — до 1000 ₽, 1.2 — 1000–3000 ₽,
   1.3 — 3000–5000 ₽, 1.4 — без ограничений.
3. Выберите сферу интересов: .1 уют и дом, .2 красота и уход,
   .3 гаджеты и техника, .4 впечатления и эмоции, .5 творчество и хобби,
   .6 вкусная еда.
4. В блоке пять идей. У каждой в конце стоят теги характера —
   берите те, где есть нужная буква. В каждом блоке для любого
   характера найдётся минимум две подходящие идеи.
5. Под идеями — строка «Если сомневаетесь»: короткий совет на случай,
   когда вы плохо знаете вкусы человека.

Пример адреса: [1.2.1] — маме, бюджет 1000–3000 ₽, уют и дом.
Комбинаций «получатель + бюджет + сфера + характер» в базе 1056,
и каждая закрыта двумя-тремя идеями.

ТЕГИ ХАРАКТЕРА
--------------
[П] Практичный  — любит полезное, использует всё, что подарили,
                  раздражается от вещей «в шкаф».
[Э] Эстет      — важен вид, материал, бренд, подача; простит
                  непрактичность за красоту.
[Р] Романтик   — покупает эмоции, атмосферу, воспоминания, «вайб».
[М] Минималист — ненавидит хлам, ценит качество, компактность,
                  одну хорошую вещь вместо пяти дешёвых.

Теги стоят у идей, а не у людей: подарок может подойти сразу
двум-трём типам, и это нормально.

ЦЕНЫ
----
Ориентиры на ноябрь 2026 года, розница РФ. На маркетплейсах
и во время распродаж цена уходит вниз на 10–30 %, в офлайн-магазинах
и в декабре — вверх. Закладывайте на упаковку и открытку ещё
150–400 ₽: в бюджете «до 1000 ₽» это заметная часть суммы,
поэтому в этом диапазоне упаковка почти всегда входит в цену.

СОДЕРЖАНИЕ
----------
1. Маме ............................................ 86
2. Папе ............................................ 303
3. Подруге ......................................... 512
4. Другу ........................................... 729
5. Коллеге / партнёру по работе .................... 946
6. Любимому человеку (жене / мужу / партнёру) ...... 1163
7. Ребёнку (сыну / дочке / племяннику) ............. 1380
8. Сестре .......................................... 1593
9. Брату ........................................... 1810
10. Свекрови ....................................... 2023
11. Тестю .......................................... 2240

Пары из вашего списка разведены по отдельным разделам: у мамы и папы,
подруги и друга, сестры и брата, свекрови и тестя разные вкусы
и разные уместные шутки. Любимый человек — один раздел,
потому что внутри идеи делятся на «для неё» и «для него».

В конце файла — четыре служебных блока: алгоритм выбора за пять минут,
список того, что дарить не стоит, идеи упаковки и чек-лист
покупателя. Они не привязаны к разделам и работают для любого подарка.

ПРАВИЛО, КОТОРОЕ ЭКОНОМИТ НЕРВЫ
-------------------------------
Подарок состоит из трёх частей: сама вещь, история вокруг неё
и упаковка. Если бюджет маленький, усилите две последние —
дешёвая вещь с легендой и красивой бумагой производит больше
впечатления, чем дорогая в пакете из магазина. Если бюджет большой,
не размывайте его на десять мелочей: одна вещь плюс одна деталь
(открытка, лента, веточка) читаются как забота, а не как «набрал

A. КАК ВЫБРАТЬ ПОДАРОК ЗА ПЯТЬ МИНУТ
------------------------------------
Шаг 1. Ответьте на один вопрос: человек живёт «вещами» или
       «впечатлениями»? Вещам — разделы .1, .2, .3, .5; впечатлениям — .4.
Шаг 2. Вспомните, на что он жалуется последний месяц. Жалоба —
       готовое ТЗ: «вечно холодно на даче» — плед, грелка, тёплые
       носки, обогреватель; «не успеваю готовить» — мультиварка,
       набор замороженных ужинов, доставка продуктов.
Шаг 3. Проверьте бюджет по чек-листу ниже и выберите блок.
Шаг 4. Возьмите одну идею из блока и одну «деталь» из блока B
       или C — подарок перестаёт быть «просто вещью».
Шаг 5. Если сомневаетесь между двумя идеями, берите ту, которую
       можно съесть, использовать за месяц или потратить вместе.
       Пылящиеся подарки проигрывают всегда.

Быстрые связки, если совсем нет времени:
— «не знаю вкусов» → еда, впечатления, сертификат в конкретное место;
— «всё есть» → расходники премиум-класса (кофе, масло, свечи, носки);
— «хочу удивить» → то, что человек не купит себе сам (см. .4 и бюджет 4);
— «коллега» → еда, кофе, канцелярия, билеты на двоих;
— «ребёнок» → набор для опытов, конструктор, настолка, поход
  в музей с квестом.

B. ЧТО ДАРИТЬ НЕ СТОИТ (И ЧЕМ ЗАМЕНИТЬ)
---------------------------------------
1. Парфюм без намёка на вкус → мини-набор пробников или свеча
   с тем же настроением.
2. Косметика «против морщин» и «для похудения» → уход за руками,
   ногами, волосами: нейтрально и приятно.
3. Дешёвые статуэтки, кружки с надписями, «сувениры» → кружка
   хорошего бренда, термокружка, стакан ручной работы.
4. Животное, растение в горшке без предупреждения → сертификат
   в питомник или на мастер-класс по флористике.
5. Сертификат «в никуда» на 1000 ₽ → сертификат в конкретное
   место с конкретным сценарием (ужин, спа, мастер-класс).
6. Алкоголь людям, о чьих привычках вы не знаете → чай, кофе,
   глинтвейн-набор, безалкогольные коктейли.
7. Вещи «для дома» без учёта интерьера → расходники: салфетки,
   свечи, полотенца нейтральных цветов.

  function parseIdea(text) {
    var tagMatch = text.match(/\[([ПЭРМ](?:\s*,\s*[ПЭРМ])*)\]\s*$/);
    if (!tagMatch) return null;
    var tags = tagMatch[1].match(/[ПЭРМ]/g) || [];
    var rest = text.slice(0, tagMatch.index).trim().replace(/[\s,;—–]+$/, '').trim();

    var price = '';
    var store = '';
    var priceMatch = rest.match(/≈\s*([\d\s.,]+?)\s*₽/);
    if (priceMatch) {
      price = priceMatch[1].replace(/\s+/g, ' ').trim().replace(/[.,]$/, '');
      store = rest.slice(priceMatch.index + priceMatch[0].length)
        .replace(/^[\s,;—–-]+/, '')
        .trim();
      rest = rest.slice(0, priceMatch.index).trim().replace(/[\s,;—–-]+$/, '').trim();
    }

    var dash = rest.indexOf(' — ');
    var title = rest;
    var desc = '';
    if (dash > 0) {
      title = rest.slice(0, dash).trim();
      desc = rest.slice(dash + 3).trim();
    }
    title = title.replace(/[\s,;—–-]+$/, '').trim();
    if (!title) return null;
    return { title: title, desc: desc, price: price, store: store, tags: tags };
  }

  function parseGifts(text) {

      if (/^РАЗДЕЛ\s+\d+\./.test(line)) { current = null; continue; }
      if (/^\d+\.\d+\.\s*БЮДЖЕТ/.test(line)) { current = null; continue; }

      var m = line.match(/^\[(\d+)\.(\d+)\.(\d+)\]\s*(.+)$/);
      if (m) {
        var key = (+m[1]) + '.' + (+m[2]) + '.' + (+m[3]);
        current = {
          key: key,
          recipient: +m[1],
          budget: +m[2],
          sphere: +m[3],
          title: m[4].trim(),
          ideas: [],
          tip: ''
        };
        blocks.set(key, current);
        continue;
      }

      if (!current) continue;

      if (line.charAt(0) === '•') {
        var idea = parseIdea(line.slice(1).trim());
        if (idea) { current.ideas.push(idea); ideaCount++; }
        continue;

      if (line.charAt(0) === '↳') {
        current.tip = line.replace(/^↳\s*/, '')
          .replace(/^Если сомневаетесь:\s*/i, '')
          .replace(/^если сомневаетесь:\s*/i, '')
          .trim();
      }
    }

    return {
      blocks: blocks,
      blockCount: blocks.size,
      ideaCount: ideaCount
    };
  }

  function pickEmoji(title, sphere) {
    var hay = String(title || '').toLowerCase();
    for (var i = 0; i < EMOJI_RULES.length; i++) {
      if (EMOJI_RULES[i][0].test(hay)) return EMOJI_RULES[i][1];
    }
    return SPHERE_EMOJI[sphere] || '🎁';
  }

  function shuffle(list, rng) {
    var rand = rng || Math.random;
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rand() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function chooseIdeas(block, letter, rng, exclude) {
    if (!block || !block.ideas.length) return [];
    var pool = block.ideas.filter(function (idea) {
      return idea.tags.indexOf(letter) !== -1;
    });
    if (pool.length < 2) pool = block.ideas.slice();

    var skip = exclude || [];
    var rand = rng || Math.random;
    var fresh = pool.filter(function (idea) { return skip.indexOf(idea.title) === -1; });

    var wanted = (skip.length && fresh.length < 2) ? 2 : (rand() < 0.5 ? 2 : 3);
    var total = Math.min(pool.length, Math.max(2, wanted));

    var picked = shuffle(fresh, rng).slice(0, Math.min(fresh.length, total));
    if (picked.length < total) {
      var rest = shuffle(pool.filter(function (idea) {
        return picked.indexOf(idea) === -1;
      }), rng);
      picked = picked.concat(rest.slice(0, total - picked.length));
    }
    return picked;
  }

  return {
    SPHERE_EMOJI: SPHERE_EMOJI,
    CHARACTER_NAMES: CHARACTER_NAMES,
    EMOJI_RULES: EMOJI_RULES,
    parseGifts: parseGifts,
    parseIdea: parseIdea,
    pickEmoji: pickEmoji,
    chooseIdeas: chooseIdeas
  };
})();

</script>

<script>
(function () {
  'use strict';

  var L = globalThis.GiftLogic;

  var RECIPIENTS = [
    { id: 1,  label: 'Маме',                emoji: '👩', desc: 'забота, тепло, деликатесы' },
    { id: 2,  label: 'Папе',                emoji: '👨', desc: 'инструмент, техника, отдых' },
    { id: 3,  label: 'Подруге',             emoji: '👭', desc: 'красота, атмосфера, впечатления' },
    { id: 4,  label: 'Другу',               emoji: '🧑', desc: 'гаджеты, хобби, хороший вечер' },
    { id: 5,  label: 'Коллеге',             emoji: '💼', desc: 'уместно и без неловкости' },
    { id: 6,  label: 'Любимому человеку',   emoji: '💞', desc: 'жест, который запомнится' },
    { id: 7,  label: 'Ребёнку',             emoji: '🧒', desc: 'игра, творчество, открытия' },
    { id: 8,  label: 'Сестре',              emoji: '👧', desc: 'стиль, уют, маленькие радости' },
    { id: 9,  label: 'Брату',               emoji: '👦', desc: 'техника, спорт, впечатления' },
    { id: 10, label: 'Свекрови',            emoji: '👵', desc: 'уважение, уют, внимание' },
    { id: 11, label: 'Тестю',               emoji: '👴', desc: 'дача, гараж, крепкий чай' }
  ];

  var BUDGETS = [
    { id: 1, label: 'До 1000 ₽',      emoji: '🎀', desc: 'приятная мелочь' },
    { id: 2, label: '1000–3000 ₽',    emoji: '🎁', desc: 'достойный подарок' },
    { id: 3, label: '3000–5000 ₽',    emoji: '🌟', desc: 'серьёзный презент' },
    { id: 4, label: 'Без ограничений', emoji: '👑', desc: 'хочу удивить' }
  ];

  var SPHERES = [
    { id: 1, label: 'Уют и дом',              emoji: '🏡', desc: 'свечи, пледы, текстиль' },
    { id: 2, label: 'Красота и уход',         emoji: '🧴', desc: 'крем, парфюм, ритуалы' },
    { id: 3, label: 'Гаджеты и техника',      emoji: '🎧', desc: 'полезно каждый день' },
    { id: 4, label: 'Впечатления и эмоции',   emoji: '🎟️', desc: 'билеты, поездки, мастер-классы' },
    { id: 5, label: 'Творчество и хобби',     emoji: '🎨', desc: 'наборы, инструменты, курсы' },
    { id: 6, label: 'Вкусная еда',            emoji: '🍫', desc: 'чай, шоколад, деликатесы' }
  ];

  var CHARACTERS = [
    { id: 'П', label: 'Практичный',  emoji: '💪', desc: 'любит полезное и нужное' },
    { id: 'Э', label: 'Эстет',       emoji: '✨', desc: 'важен вид, материал, подача' },
    { id: 'Р', label: 'Романтик',    emoji: '💝', desc: 'эмоции, атмосфера, воспоминания' },
    { id: 'М', label: 'Минималист',  emoji: '🤍', desc: 'качество без лишнего хлама' }
  ];

  var STEPS = [
    { key: 'recipient', title: 'Кому дарим?', hint: 'Выберите того, для кого ищем подарок. У каждого — свой раздел идей.', options: RECIPIENTS },
    { key: 'budget', title: 'Какой бюджет?', hint: 'Цены ориентировочные. Упаковка и открытка — отдельная строка.', options: BUDGETS },
    { key: 'sphere', title: 'Что человек любит?', hint: 'Выберите самую близкую сферу — идеи подстроятся под неё.', options: SPHERES },
    { key: 'character', title: 'Что для человека важнее?', hint: 'Одна черта поможет отсеять неподходящее и оставить точное.', options: CHARACTERS }
  ];

  var view = document.getElementById('view');
  var live = document.getElementById('live');

  var catalog = null;
  var state = { step: 0, recipient: null, budget: null, sphere: null, character: null };
  var currentBlock = null;
  var currentIdeas = [];

  /* ---------- утилиты ---------- */
  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function formatNum(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  function formatPrice(raw) {
    var digits = String(raw).replace(/[^\d]/g, '');
    return digits ? formatNum(Number(digits)) : esc(raw);
  }

  function findById(list, id) {
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].id) === String(id)) return list[i];
    }
    return null;
  }

  function setLive(text) {
    if (live) live.textContent = text;
  }

  function setView(html, options) {
    var opts = options || {};
    view.innerHTML = html;
    if (opts.live) setLive(opts.live);
    if (opts.focus !== false) {
      var target = view.querySelector(opts.focusSel || 'h1, h2');
      if (target && target.focus) target.focus({ preventScroll: true });
    }
    if (window.scrollY > 6) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ---------- экраны ---------- */
  function renderIntro() {
    var html = ''
      + '<div class="intro">'
      +   '<div class="sprig" aria-hidden="true"><span class="sprig__line"></span><span class="sprig__flake">❆</span><span class="sprig__line"></span></div>'
      +   '<p class="eyebrow">Новогодний помощник</p>'
      +   '<h1 class="title">Подберем идеальный подарок</h1>'
      +   '<p class="lede">Четыре коротких вопроса — и у вас на руках две-три идеи, которые действительно подойдут. Тепло, по делу и без бесконечного поиска.</p>'
      +   '<button class="btn btn--primary" type="button" data-action="start">'
      +     '<span>Начать подбор</span><span class="btn__arrow" aria-hidden="true">→</span>'
      +   '</button>'
      +   '<p class="meta">4 вопроса · <span id="idea-count">1 320</span> идей · 1 056 комбинаций</p>'
      + '</div>';
    setView(html, { focus: false });
    if (catalog) {
      var countEl = document.getElementById('idea-count');
      if (countEl) countEl.textContent = formatNum(catalog.ideaCount);
    }
  }

  function renderQuestion() {
    var step = STEPS[state.step];
    var html = '<div class="question">';
    html += '<div class="progress" role="progressbar" aria-label="Прогресс подбора" aria-valuemin="1" aria-valuemax="4" aria-valuenow="' + (state.step + 1) + '">';
    for (var i = 0; i < STEPS.length; i++) {
      html += '<span class="' + (i <= state.step ? 'on' : '') + '"></span>';
    }
    html += '</div>';
    html += '<div class="qhead">'
      + '<button class="back" type="button" data-action="back">← Назад</button>'
      + '<span class="step-label">Шаг ' + (state.step + 1) + ' из 4</span>'
      + '</div>';
    html += '<h2 class="qtitle" tabindex="-1">' + esc(step.title) + '</h2>';
    html += '<p class="qhint">' + esc(step.hint) + '</p>';
    html += '<div class="options">';
    for (var j = 0; j < step.options.length; j++) {
      var option = step.options[j];
      html += '<button class="opt" type="button" data-value="' + esc(option.id) + '">'
        + '<span class="opt__emoji" aria-hidden="true">' + option.emoji + '</span>'
        + '<span class="opt__text">'
        +   '<span class="opt__label">' + esc(option.label) + '</span>'
        +   '<span class="opt__desc">' + esc(option.desc) + '</span>'
        + '</span>'
        + '</button>';
    }
    html += '</div></div>';

    setView(html, { live: 'Шаг ' + (state.step + 1) + ' из 4. ' + step.title });
  }

  function ideaHTML(idea, index) {
    var sphere = currentBlock ? currentBlock.sphere : 0;
    var emoji = L.pickEmoji(idea.title, sphere);
    var meta = '';
    if (idea.price) meta += '<span class="price">≈ ' + formatPrice(idea.price) + ' ₽</span>';
    if (idea.store) meta += '<span class="store">' + esc(idea.store) + '</span>';

    return '<article class="idea" style="--d:' + (index * 70) + 'ms">'
      + '<div class="idea__icon" aria-hidden="true">' + emoji + '</div>'
      + '<div class="idea__body">'
      +   '<h3 class="idea__title">' + esc(idea.title) + '</h3>'
      +   (idea.desc ? '<p class="idea__desc">' + esc(idea.desc) + '</p>' : '')
      +   (meta ? '<div class="idea__meta">' + meta + '</div>' : '')
      + '</div>'
      + '</article>';
  }

  function ideasHTML(list) {
    var html = '';
    for (var i = 0; i < list.length; i++) html += ideaHTML(list[i], i);
    return html;
  }

  function summaryChips() {
    var recipient = findById(RECIPIENTS, state.recipient);
    var budget = findById(BUDGETS, state.budget);
    var sphere = findById(SPHERES, state.sphere);
    var character = findById(CHARACTERS, state.character);
    return [recipient, budget, sphere, character]
      .filter(Boolean)
      .map(function (item) { return '<span>' + esc(item.label.toLowerCase()) + '</span>'; })
      .join('');
  }

  function renderResult() {
    var html = '<div class="result">';
    html += '<p class="eyebrow"><span class="eyebrow__line"></span>Подборка готова</p>';
    html += '<h2 class="title title--result" tabindex="-1">Ваш идеальный подарок</h2>';
    html += '<div class="picked">' + summaryChips() + '</div>';
    html += '<div class="ideas" id="ideas">' + ideasHTML(currentIdeas) + '</div>';
    if (currentBlock && currentBlock.tip) {
      html += '<div class="tip"><span class="tip__label">Если сомневаетесь:</span><p>' + esc(currentBlock.tip) + '</p></div>';
    }
    html += '<div class="actions">'
      + '<button class="btn btn--ghost" type="button" data-action="reroll">Ещё варианты</button>'
      + '<button class="btn btn--primary" type="button" data-action="restart">Пройти заново</button>'
      + '</div>';
    html += '</div>';

    setView(html, { live: 'Ваш идеальный подарок. Подобрано идей: ' + currentIdeas.length + '.' });
  }

  function renderIdeas() {
    var box = document.getElementById('ideas');
    if (!box) return;
    box.innerHTML = ideasHTML(currentIdeas);
    setLive('Показаны другие идеи: ' + currentIdeas.length + '.');
  }

  /* ---------- логика экранов ---------- */
  function startSurvey() {
    state.step = 0;
    renderQuestion();
  }

  function answer(value) {
    var step = STEPS[state.step];
    var option = findById(step.options, value);
    if (!option) return;

    state[step.key] = option.id;

    if (state.step < STEPS.length - 1) {
      state.step += 1;
      renderQuestion();
    } else {
      showResult();
    }
  }

  function goBack() {
    if (state.step > 0) {
      state.step -= 1;
      renderQuestion();
    } else {
      renderIntro();
    }
  }

  function restart() {
    state.step = 0;
    state.recipient = null;
    state.budget = null;
    state.sphere = null;
    state.character = null;
    currentBlock = null;
    currentIdeas = [];
    renderQuestion();
  }

  function showResult() {
    var key = state.recipient + '.' + state.budget + '.' + state.sphere;
    var block = catalog.blocks.get(key) || null;

    if (!block) {
      var blocks = catalog.blocks.values();
      for (var item = blocks.next(); !item.done; item = blocks.next()) {
        if (item.value.recipient === state.recipient && item.value.sphere === state.sphere) {
          block = item.value;
          break;
        }
      }
    }

    if (!block || !block.ideas.length) {
      setView(
        '<div class="result"><p class="eyebrow"><span class="eyebrow__line"></span>Подборка</p>'
        + '<h2 class="title title--result" tabindex="-1">Не удалось собрать идеи</h2>'
        + '<p class="lede" style="margin-left:0">Попробуйте пройти подбор ещё раз — данные загружены не полностью.</p>'
        + '<div class="actions"><button class="btn btn--primary" type="button" data-action="restart">Пройти заново</button></div></div>',
        { live: 'Не удалось собрать идеи. Попробуйте ещё раз.' }
      );
      return;
    }

    currentBlock = block;
    currentIdeas = L.chooseIdeas(block, state.character, Math.random, []);
    if (!currentIdeas.length) {
      currentIdeas = block.ideas.slice(0, 2);
    }
    renderResult();
  }

  function reroll() {
    if (!currentBlock) return;
    var exclude = currentIdeas.map(function (idea) { return idea.title; });
    var next = L.chooseIdeas(currentBlock, state.character, Math.random, exclude);
    if (!next.length) return;
    currentIdeas = next;
    renderIdeas();
  }

  /* ---------- события ---------- */
  function onClick(event) {
    var target = event.target;
    if (!target || !target.closest) return;

    var actionEl = target.closest('[data-action]');
    if (actionEl && view.contains(actionEl)) {
      var action = actionEl.getAttribute('data-action');
      if (action === 'start') startSurvey();
      else if (action === 'back') goBack();
      else if (action === 'restart') restart();
      else if (action === 'reroll') reroll();
      return;
    }

    var optionEl = target.closest('.opt[data-value]');
    if (optionEl && view.contains(optionEl)) {
      answer(optionEl.getAttribute('data-value'));
    }
  }

  /* ---------- снег ---------- */
  function startSnow() {
    var canvas = document.getElementById('snow');
    if (!canvas) return;
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    var ctx = canvas.getContext('2d');
    if (!ctx) return;

    var width = 0;
    var height = 0;
    var dpr = 1;
    var flakes = [];
    var rafId = 0;

    function makeFlakes() {
      var count = Math.round(Math.min(80, Math.max(26, window.innerWidth / 20)));
      flakes = [];
      for (var i = 0; i < count; i++) {
        flakes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: (0.7 + Math.random() * 2.1) * dpr,
          speed: (0.14 + Math.random() * 0.5) * dpr,
          drift: 0.25 + Math.random() * 0.85,
          phase: Math.random() * Math.PI * 2,
          alpha: 0.18 + Math.random() * 0.45
        });
      }
    }

    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      width = canvas.width = Math.floor(window.innerWidth * dpr);
      height = canvas.height = Math.floor(window.innerHeight * dpr);
      makeFlakes();
    }

    function frame() {
      ctx.clearRect(0, 0, width, height);
      for (var i = 0; i < flakes.length; i++) {
        var flake = flakes[i];
        flake.y += flake.speed;
        flake.phase += 0.008;
        flake.x += Math.sin(flake.phase) * flake.drift * 0.35;

        if (flake.y > height + 6) {
          flake.y = -6;
          flake.x = Math.random() * width;
        }
        if (flake.x < -6) flake.x = width + 6;
        else if (flake.x > width + 6) flake.x = -6;

        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,252,240,' + flake.alpha + ')';
        ctx.fill();
      }
      rafId = window.requestAnimationFrame(frame);
    }

    resize();
    window.addEventListener('resize', resize);
    frame();

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        window.cancelAnimationFrame(rafId);
        rafId = 0;
      } else if (!rafId) {
        frame();
      }
    });
  }

  /* ---------- данные ---------- */
  function refreshFromFile() {
    fetch('gifts-data.txt', { cache: 'no-store' })
      .then(function (response) { return response.ok ? response.text() : ''; })
      .then(function (text) {
        if (!text || text.indexOf('РАЗДЕЛ 1.') === -1) return;
        var fresh = L.parseGifts(text);
        if (fresh.blockCount === catalog.blockCount && fresh.ideaCount === catalog.ideaCount) {
          catalog = fresh;
          var note = document.getElementById('data-note');
          if (note) {
            note.textContent = formatNum(catalog.ideaCount) + ' идей · ' + catalog.blockCount + ' подборки';
          }
        }
      })
      .catch(function () { /* работаем на встроенной копии данных */ });
  }

  /* ---------- старт ---------- */
  function init() {
    var source = document.getElementById('gifts-source');
    if (!source) return;

    catalog = L.parseGifts(source.textContent);
    if (!catalog.blockCount) {
      setView('<div class="result"><h2 class="title title--result">Данные не загрузились</h2></div>', { focus: false });
      return;
    }

    var note = document.getElementById('data-note');
    if (note) {
      note.textContent = formatNum(catalog.ideaCount) + ' идей · ' + catalog.blockCount + ' подборки';
    }

    renderIntro();
    startSnow();
    view.addEventListener('click', onClick);

    if (/^https?:$/.test(location.protocol)) refreshFromFile();
  }

  init();
})();

</script>
